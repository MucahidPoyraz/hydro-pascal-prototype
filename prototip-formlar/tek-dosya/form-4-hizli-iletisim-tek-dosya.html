<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Hızlı İletişim — Prototip | HydroPascal</title>
<style>
/* =========================================================================
   PROTOTİP: Bu form ileride React/Next.js veya ASP.NET backend'e taşınacaktır.
   FormSubmit geçici çözümdür.
   =========================================================================
   HydroPascal — FormSubmit prototip form stilleri
   Harici kütüphane yok, CDN yok, ikon fontu yok. Saf CSS.
   Palet: koyu lacivert #1a2b4a + turuncu vurgu #e85d04
   ========================================================================= */

:root {
  --fs-navy: #1a2b4a;
  --fs-navy-700: #24395f;
  --fs-navy-300: #5b6b87;
  --fs-orange: #e85d04;
  --fs-orange-dark: #c64e03;
  --fs-orange-tint: #fdf1e8;

  --fs-ink: #1f2733;
  --fs-ink-soft: #5b6b87;
  --fs-paper: #ffffff;
  --fs-surface: #f6f8fb;
  --fs-line: #d5dce6;

  --fs-error: #c0392b;
  --fs-error-tint: #fdecea;
  --fs-success: #1e7a46;
  --fs-success-tint: #e8f5ee;

  --fs-radius: 4px;
  --fs-gap: 18px;
  --fs-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Kabuk ---------- */
.fs-wrap {
  font-family: var(--fs-font);
  color: var(--fs-ink);
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 56px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.fs-wrap--narrow { max-width: 460px; }

.fs-head { border-bottom: 3px solid var(--fs-orange); padding-bottom: 14px; margin-bottom: 26px; }
.fs-head h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; color: var(--fs-navy); font-weight: 700; }
.fs-head p { margin: 0; color: var(--fs-ink-soft); font-size: .93rem; }

.fs-form {
  background: var(--fs-paper);
  border: 1px solid var(--fs-line);
  border-radius: var(--fs-radius);
  padding: 26px;
}

/* ---------- Izgara ---------- */
.fs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--fs-gap); }
.fs-grid--3 { grid-template-columns: repeat(3, 1fr); }
.fs-span-2 { grid-column: 1 / -1; }

@media (max-width: 640px) {
  .fs-grid, .fs-grid--3 { grid-template-columns: 1fr; }
  .fs-span-2 { grid-column: auto; }
  .fs-form { padding: 18px; }
  .fs-wrap { padding: 20px 14px 40px; }
}

/* ---------- Alanlar ---------- */
.fs-field { display: flex; flex-direction: column; margin-bottom: var(--fs-gap); }
.fs-grid .fs-field { margin-bottom: 0; }

.fs-label {
  font-size: .82rem;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--fs-navy);
  margin-bottom: 6px;
}
.fs-req { color: var(--fs-orange); margin-left: 2px; }

.fs-input, .fs-select, .fs-textarea {
  font: inherit;
  font-size: .95rem;
  color: var(--fs-ink);
  background: var(--fs-paper);
  border: 1px solid var(--fs-line);
  border-radius: var(--fs-radius);
  padding: 10px 12px;
  width: 100%;
  box-sizing: border-box;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.fs-textarea { resize: vertical; min-height: 110px; }
.fs-select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235b6b87' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }

.fs-input:focus, .fs-select:focus, .fs-textarea:focus {
  outline: none;
  border-color: var(--fs-orange);
  box-shadow: 0 0 0 3px rgba(232, 93, 4, .18);
}

.fs-input[aria-invalid="true"], .fs-select[aria-invalid="true"], .fs-textarea[aria-invalid="true"] {
  border-color: var(--fs-error);
  background: var(--fs-error-tint);
}

/* ---------- Hata metni ---------- */
.fs-error {
  display: none;
  color: var(--fs-error);
  font-size: .78rem;
  margin-top: 5px;
}
.fs-error.is-visible { display: block; }

/* ---------- Radyo grubu ---------- */
.fs-radios { display: flex; flex-wrap: wrap; gap: 10px; }
.fs-radio {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--fs-line);
  border-radius: var(--fs-radius);
  padding: 9px 14px;
  font-size: .9rem;
  cursor: pointer;
  background: var(--fs-surface);
}
.fs-radio input { accent-color: var(--fs-orange); margin: 0; }
.fs-radio:has(input:checked) { border-color: var(--fs-orange); background: var(--fs-orange-tint); }

/* ---------- Dosya ---------- */
.fs-file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fs-file-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  color: var(--fs-navy);
  background: var(--fs-surface);
  border: 1px solid var(--fs-line);
  border-radius: var(--fs-radius);
  padding: 9px 14px;
  cursor: pointer;
}
.fs-file-btn:hover { border-color: var(--fs-orange); color: var(--fs-orange); }
.fs-file-btn svg { width: 15px; height: 15px; flex: none; }
.fs-file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.fs-file-info { font-size: .82rem; color: var(--fs-ink-soft); }
.fs-file-info strong { color: var(--fs-ink); font-weight: 600; word-break: break-all; }
.fs-file-clear {
  font: inherit; font-size: .82rem; color: var(--fs-error);
  background: none; border: none; cursor: pointer; padding: 2px 4px; text-decoration: underline;
}

/* ---------- KVKK onayı ---------- */
.fs-consent {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--fs-surface);
  border: 1px solid var(--fs-line);
  border-radius: var(--fs-radius);
  padding: 13px 15px;
  margin: 4px 0 var(--fs-gap);
}
.fs-consent input { margin: 3px 0 0; accent-color: var(--fs-orange); flex: none; width: 16px; height: 16px; }
.fs-consent label { font-size: .8rem; color: var(--fs-ink-soft); line-height: 1.5; }
.fs-consent a { color: var(--fs-orange); }

/* ---------- Butonlar ---------- */
.fs-btn {
  font: inherit;
  font-size: .97rem;
  font-weight: 700;
  letter-spacing: .01em;
  color: #fff;
  background: var(--fs-orange);
  border: none;
  border-radius: var(--fs-radius);
  padding: 13px 26px;
  cursor: pointer;
  transition: background .15s ease;
}
.fs-btn:hover:not(:disabled) { background: var(--fs-orange-dark); }
.fs-btn:focus-visible { outline: 3px solid rgba(232, 93, 4, .35); outline-offset: 2px; }
.fs-btn:disabled { background: var(--fs-navy-300); cursor: not-allowed; opacity: .75; }
.fs-btn--block { width: 100%; }

/* ---------- Bildirim kutuları ---------- */
.fs-alert {
  display: none;
  border-radius: var(--fs-radius);
  padding: 13px 16px;
  font-size: .9rem;
  margin-top: 16px;
  border: 1px solid transparent;
}
.fs-alert.is-visible { display: flex; gap: 10px; align-items: flex-start; }
.fs-alert svg { width: 17px; height: 17px; flex: none; margin-top: 2px; }
.fs-alert--success { background: var(--fs-success-tint); border-color: var(--fs-success); color: var(--fs-success); }
.fs-alert--error { background: var(--fs-error-tint); border-color: var(--fs-error); color: var(--fs-error); }

/* ---------- Notlar ---------- */
.fs-note {
  font-size: .78rem;
  color: var(--fs-ink-soft);
  border-left: 3px solid var(--fs-line);
  padding: 2px 0 2px 11px;
  margin-top: 14px;
}
.fs-note--accent { border-left-color: var(--fs-orange); }
.fs-note a { color: var(--fs-orange); }

/* ---------- Honeypot (görünmez olmalı) ---------- */
.fs-honey { display: none !important; }

/* ---------- Footer varyantı (Form 4) ---------- */
.fs-compact { background: var(--fs-navy); border-color: var(--fs-navy-700); }
.fs-compact .fs-label { color: #e8edf5; }
.fs-compact .fs-input, .fs-compact .fs-textarea { background: #16243d; border-color: var(--fs-navy-700); color: #eef2f8; }
.fs-compact .fs-input::placeholder, .fs-compact .fs-textarea::placeholder { color: #7f8ea9; }
.fs-compact .fs-consent { background: #16243d; border-color: var(--fs-navy-700); }
.fs-compact .fs-consent label { color: #b9c5d8; }
.fs-compact .fs-note { color: #9aa9c2; border-left-color: var(--fs-navy-700); }
.fs-compact .fs-textarea { min-height: 84px; }

@media (prefers-reduced-motion: reduce) {
  .fs-input, .fs-select, .fs-textarea, .fs-btn { transition: none; }
}

</style>
</head>
<body style="margin:0;background:#eef1f6">
<!-- PROTOTİP: Bu form ileride React/Next.js veya ASP.NET backend'e taşınacaktır. FormSubmit geçici çözümdür. -->
<div class="fs-wrap fs-wrap--narrow">
  <header class="fs-head">
    <h1>Hızlı İletişim</h1>
    <p>Kısa sorularınız için — 1 dakikada gönderin.</p>
  </header>
  <form data-fs-form="hizli-iletisim" class="fs-form fs-compact" action="https://formsubmit.co/info@sitename.com.tr" method="POST" novalidate>

    <input type="hidden" name="_subject" value="Hızlı İletişim - Yeni Mesaj">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://sitename.com.tr/tesekkurler.html">
    <input type="hidden" name="_cc" value="info@sitename.com.tr">
    <input type="hidden" name="_autoresponse" value="Mesajınız için teşekkür ederiz. En kısa sürede size dönüş yapacağız.">

    <input type="text" name="_honey" class="fs-honey fs-honey-input" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="fs-field">
      <label class="fs-label" for="f-email">E-posta<span class="fs-req" aria-hidden="true">*</span></label>
      <input class="fs-input" type="email" id="f-email" name="email" required aria-required="true" aria-describedby="f-email-err" autocomplete="email" inputmode="email" placeholder="ornek@firma.com">
      <p class="fs-error" id="f-email-err" role="alert"></p>
    </div>

    <div class="fs-field">
      <label class="fs-label" for="f-message">Kısa Mesaj<span class="fs-req" aria-hidden="true">*</span></label>
      <textarea class="fs-textarea" id="f-message" name="Mesaj" required aria-required="true" minlength="10" aria-describedby="f-message-err" placeholder="Nasıl yardımcı olabiliriz?"></textarea>
      <p class="fs-error" id="f-message-err" role="alert"></p>
    </div>

    <div class="fs-consent">
      <input type="checkbox" id="f-kvkk" name="KVKK Onayı" value="Onaylandı" required aria-required="true">
      <label for="f-kvkk">Kişisel verilerimin, talebimin değerlendirilmesi ve tarafımla iletişime geçilmesi amacıyla; form altyapısı için kullanılan FormSubmit.co (ABD merkezli) üzerinden işlenmesine ve info@sitename.com.tr adresine iletilmesine onay veriyorum. <a href="/kvkk.html">KVKK Aydınlatma Metni</a>'ni okudum.</label>
    </div>

    <button type="submit" class="fs-btn fs-btn--block" data-fs-submit>Gönder</button>

    <div class="fs-alert fs-alert--success" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-fs-alert-text></span>
    </div>
    <div class="fs-alert fs-alert--error" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5" stroke-linecap="round"/></svg>
      <span data-fs-alert-text></span>
    </div>
  </form>
</div>
<script>
/* =========================================================================
   PROTOTİP: Bu form ileride React/Next.js veya ASP.NET backend'e taşınacaktır.
   FormSubmit geçici çözümdür.
   =========================================================================
   HydroPascal — FormSubmit prototip form motoru (vanilla JS, bağımlılık yok)

   GÜVENLİK NOTU
   -------------
   Buradaki doğrulamaların tamamı UX içindir, GÜVENLİK DEĞİLDİR. Tarayıcı
   tarafındaki hiçbir kontrol (zorunlu alan, dosya boyutu, uzantı, KVKK
   onayı, honeypot) saldırganı durdurmaz — hepsi devre dışı bırakılabilir.
   Gerçek doğrulama sunucu tarafında yapılmalıdır ve ASP.NET/Next.js
   geçişinde eklenecektir. Dosya yükleme için bu özellikle geçerlidir:
   uzantı ve boyut kontrolü mutlaka sunucuda tekrarlanmalıdır.

   DOSYA EKİ + AJAX
   ----------------
   FormSubmit'in /ajax/ uç noktası dosya eklerini İLETMEZ (yalnızca alan
   değerlerini döndürür). Ekler, standart multipart/form-data POST ile
   https://formsubmit.co/<eposta> adresine gönderildiğinde çalışır.
   Bu yüzden motor şöyle davranır:
     - Dosya seçilmemişse -> AJAX (sayfa yenilenmez, tercih edilen yol)
     - Dosya seçilmişse    -> klasik POST'a düşer (sayfa yenilenir, _next
                              adresine yönlenir)
   Böylece ek kaybı yaşanmaz. Canlı testte AJAX'ın ek desteklediği
   doğrulanırsa CONFIG.ajaxSupportsFiles = true yapmak yeterlidir.
   ========================================================================= */
(function () {
  'use strict';

  var CONFIG = {
    // FormSubmit hedef adresi. Not: e-posta adresini HTML'de açıkta
    // bırakmamak için FormSubmit'in hash'li uç noktası tercih edilebilir
    // (bkz. README, "E-postayı gizleme").
    email: 'info@sitename.com.tr',
    ajaxBase: 'https://formsubmit.co/ajax/',
    postBase: 'https://formsubmit.co/',

    ajaxSupportsFiles: false, // canlı testte doğrulanırsa true yapın

    maxBytes: 10 * 1024 * 1024, // 10 MB — mail sunucusu limiti
    allowedExt: ['pdf', 'dwg', 'dxf', 'step', 'stp', 'igs', 'zip', 'rar', 'jpg', 'jpeg', 'png'],

    successHideMs: 5000
  };

  var MSG = {
    required: 'Bu alan zorunludur.',
    email: 'Geçerli bir e-posta adresi girin.',
    phone: 'Geçerli bir telefon numarası girin (en az 10 karakter).',
    minlength: function (n) { return 'En az ' + n + ' karakter girin.'; },
    number: 'Geçerli bir sayı girin.',
    radio: 'Lütfen bir seçim yapın.',
    consent: 'Devam etmek için onay kutusunu işaretlemelisiniz.',
    fileTooBig: function (mb) { return 'Dosya boyutu 10 MB sınırını aşıyor (' + mb + ').'; },
    fileExt: 'Bu dosya türü kabul edilmiyor. İzin verilenler: ' + CONFIG.allowedExt.join(', ') + '.',
    sending: 'Gönderiliyor...',
    ok: 'Mesajınız başarıyla gönderildi. En kısa sürede size dönüş yapacağız.',
    fail: 'Gönderim sırasında bir sorun oluştu. Lütfen tekrar deneyin veya doğrudan ' + CONFIG.email + ' adresine yazın.',
    network: 'Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.'
  };

  /* --------------------------------------------------------------- yardımcı */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function formatSize(bytes) {
    if (bytes < 1024) { return bytes + ' B'; }
    if (bytes < 1024 * 1024) { return (bytes / 1024).toFixed(1) + ' KB'; }
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  // Dosya adı yalnızca EKRANDA gösterilecek; güvenlik amaçlı değil.
  function safeName(name) {
    return String(name).replace(/[\u0000-\u001f<>"'`\\]/g, '').slice(0, 80);
  }

  function extOf(name) {
    var i = String(name).lastIndexOf('.');
    return i < 0 ? '' : String(name).slice(i + 1).toLowerCase();
  }

  function setError(field, message) {
    var box = field.parentNode.querySelector('.fs-error');
    if (message) {
      field.setAttribute('aria-invalid', 'true');
      if (box) { box.textContent = message; box.classList.add('is-visible'); }
    } else {
      field.setAttribute('aria-invalid', 'false');
      if (box) { box.textContent = ''; box.classList.remove('is-visible'); }
    }
  }

  function showAlert(form, kind, text) {
    var box = $('.fs-alert--' + kind, form);
    var other = $('.fs-alert--' + (kind === 'success' ? 'error' : 'success'), form);
    if (other) { other.classList.remove('is-visible'); }
    if (!box) { return null; }
    var slot = box.querySelector('[data-fs-alert-text]');
    if (slot) { slot.textContent = text; }
    box.classList.add('is-visible');
    return box;
  }

  function hideAlerts(form) {
    $$('.fs-alert', form).forEach(function (b) { b.classList.remove('is-visible'); });
  }

  /* ------------------------------------------------------------ doğrulama */

  function validateField(field) {
    var v = (field.value || '').trim();
    var type = field.getAttribute('type');

    if (field.hasAttribute('required') && !v) {
      setError(field, MSG.required); return false;
    }
    if (!v) { setError(field, ''); return true; } // boş + opsiyonel

    if (type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      setError(field, MSG.email); return false;
    }
    if (type === 'tel') {
      var digits = v.replace(/[^\d]/g, '');
      if (!/^[0-9+\s()\-]{10,20}$/.test(v) || digits.length < 10) {
        setError(field, MSG.phone); return false;
      }
    }
    if (type === 'number') {
      if (isNaN(parseFloat(v))) { setError(field, MSG.number); return false; }
      var min = field.getAttribute('min');
      if (min !== null && parseFloat(v) < parseFloat(min)) {
        setError(field, 'En küçük değer ' + min + ' olabilir.'); return false;
      }
    }
    var ml = field.getAttribute('minlength');
    if (ml && v.length < parseInt(ml, 10)) {
      setError(field, MSG.minlength(ml)); return false;
    }

    setError(field, '');
    return true;
  }

  function validateRadioGroup(form, groupName) {
    var radios = $$('input[type="radio"][name="' + groupName + '"]', form);
    if (!radios.length) { return true; }
    var wrap = radios[0].closest('.fs-field');
    var box = wrap ? wrap.querySelector('.fs-error') : null;
    var checked = radios.some(function (r) { return r.checked; });
    var required = radios[0].hasAttribute('required');
    if (required && !checked) {
      if (box) { box.textContent = MSG.radio; box.classList.add('is-visible'); }
      return false;
    }
    if (box) { box.classList.remove('is-visible'); }
    return true;
  }

  function validateForm(form) {
    var ok = true;
    var first = null;

    $$('input, select, textarea', form).forEach(function (el) {
      if (el.type === 'hidden' || el.type === 'file' || el.type === 'radio' ||
          el.type === 'checkbox' || el.classList.contains('fs-honey-input')) { return; }
      if (!validateField(el)) { ok = false; if (!first) { first = el; } }
    });

    var seen = {};
    $$('input[type="radio"]', form).forEach(function (r) {
      if (seen[r.name]) { return; }
      seen[r.name] = true;
      if (!validateRadioGroup(form, r.name)) { ok = false; if (!first) { first = r; } }
    });

    var fileState = form.__fsFile;
    if (fileState && fileState.error) { ok = false; if (!first) { first = fileState.input; } }

    if (!ok && first) {
      first.focus();
      if (first.scrollIntoView) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    return ok;
  }

  /* --------------------------------------------------------- dosya yönetimi */

  function initFile(form) {
    var input = $('.fs-file-input', form);
    if (!input) { return; }

    var info = $('[data-fs-file-info]', form);
    var errBox = input.closest('.fs-field').querySelector('.fs-error');
    var clearBtn = $('[data-fs-file-clear]', form);
    var state = { input: input, error: null, file: null };
    form.__fsFile = state;

    function reset() {
      input.value = '';
      state.file = null;
      state.error = null;
      if (info) { info.innerHTML = ''; }
      if (errBox) { errBox.classList.remove('is-visible'); errBox.textContent = ''; }
      input.setAttribute('aria-invalid', 'false');
      if (clearBtn) { clearBtn.hidden = true; }
    }

    function fail(msg) {
      state.error = msg;
      state.file = null;
      input.setAttribute('aria-invalid', 'true');
      if (errBox) { errBox.textContent = msg; errBox.classList.add('is-visible'); }
      if (info) { info.innerHTML = ''; }
      if (clearBtn) { clearBtn.hidden = false; }
    }

    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) { reset(); return; }

      state.error = null;
      if (errBox) { errBox.classList.remove('is-visible'); }

      if (CONFIG.allowedExt.indexOf(extOf(f.name)) === -1) { fail(MSG.fileExt); return; }
      if (f.size > CONFIG.maxBytes) { fail(MSG.fileTooBig(formatSize(f.size))); return; }

      state.file = f;
      input.setAttribute('aria-invalid', 'false');
      if (info) {
        info.innerHTML = '<strong></strong> <span></span>';
        info.querySelector('strong').textContent = safeName(f.name);
        info.querySelector('span').textContent = '(' + formatSize(f.size) + ')';
      }
      if (clearBtn) { clearBtn.hidden = false; }
    });

    if (clearBtn) {
      clearBtn.hidden = true;
      clearBtn.addEventListener('click', reset);
    }

    var trigger = $('[data-fs-file-trigger]', form);
    if (trigger) {
      trigger.addEventListener('click', function () { input.click(); });
    }
  }

  /* ------------------------------------------------------------ KVKK kapısı */

  function initConsent(form, submitBtn) {
    var consent = $('.fs-consent input[type="checkbox"]', form);
    if (!consent) { return; }

    function sync() { submitBtn.disabled = !consent.checked; }
    consent.addEventListener('change', sync);
    sync();
  }

  /* --------------------------------------------------------------- gönderim */

  function nativePost(form) {
    // Dosya ekli gönderim: FormSubmit'in klasik uç noktası kullanılır.
    // preventDefault edilmiş olduğu için form.submit() ile elle tetikleniyor.
    form.setAttribute('action', CONFIG.postBase + CONFIG.email);
    form.setAttribute('method', 'POST');
    form.setAttribute('enctype', 'multipart/form-data');
    HTMLFormElement.prototype.submit.call(form);
  }

  function ajaxPost(form, btn, label) {
    var data = new FormData(form);
    // Honeypot'u taşımaya gerek yok; boşsa zaten anlamsız.
    data.delete('_honey');

    return fetch(CONFIG.ajaxBase + CONFIG.email, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    })
      .then(function (res) {
        return res.json().catch(function () { return { success: res.ok ? 'true' : 'false' }; });
      })
      .then(function (json) {
        var ok = json && (json.success === true || json.success === 'true');
        if (!ok) { throw new Error(json && json.message ? json.message : 'FormSubmit hata döndürdü'); }

        form.reset();
        if (form.__fsFile) { form.__fsFile.input.value = ''; }
        $$('[data-fs-file-info]', form).forEach(function (i) { i.innerHTML = ''; });
        $$('input, select, textarea', form).forEach(function (el) { el.setAttribute('aria-invalid', 'false'); });
        $$('.fs-error', form).forEach(function (e) { e.classList.remove('is-visible'); });

        var box = showAlert(form, 'success', MSG.ok);
        // KVKK sıfırlandığı için buton yeniden kilitlenir
        var consent = $('.fs-consent input[type="checkbox"]', form);
        btn.disabled = consent ? !consent.checked : false;

        if (box) {
          window.setTimeout(function () { box.classList.remove('is-visible'); }, CONFIG.successHideMs);
        }
      })
      .catch(function (err) {
        var msg = (err && err.name === 'TypeError') ? MSG.network : MSG.fail;
        showAlert(form, 'error', msg);
        btn.disabled = false;
      })
      .then(function () {
        btn.textContent = label;
      });
  }

  /* ------------------------------------------------------------------- init */

  function bind(form) {
    var btn = $('[data-fs-submit]', form) || $('button[type="submit"]', form);
    if (!btn) { return; }
    var label = btn.textContent;

    initFile(form);
    initConsent(form, btn);

    // Alandan çıkınca doğrula (ilk denemede kullanıcıyı boğmamak için blur'da)
    $$('input, select, textarea', form).forEach(function (el) {
      if (el.type === 'hidden' || el.type === 'file' || el.classList.contains('fs-honey-input')) { return; }
      el.addEventListener('blur', function () {
        if (el.type === 'radio' || el.type === 'checkbox') { return; }
        validateField(el);
      });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      hideAlerts(form);

      // Honeypot doluysa: bot. Sessizce yut, başarı da gösterme.
      var honey = form.querySelector('.fs-honey-input');
      if (honey && honey.value) { return; }

      var consent = $('.fs-consent input[type="checkbox"]', form);
      if (consent && !consent.checked) {
        showAlert(form, 'error', MSG.consent);
        consent.focus();
        return;
      }

      if (!validateForm(form)) { return; }

      btn.disabled = true;
      btn.textContent = MSG.sending;

      var hasFile = form.__fsFile && form.__fsFile.file;
      if (hasFile && !CONFIG.ajaxSupportsFiles) {
        // Ek var -> AJAX ek taşımadığı için klasik POST'a düş.
        nativePost(form);
        return; // sayfa _next adresine yönlenecek
      }

      ajaxPost(form, btn, label);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    $$('form[data-fs-form]').forEach(bind);
  });
})();

</script>
</body>
</html>
