<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroPascal | Select Language / Dil Seçin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  (function () {
    var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    var target = lang.indexOf("tr") === 0 ? "tr/index.html" : "en/index.html";
    window.location.replace(target);
  })();
</script>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-slate-300 antialiased">

<div class="relative min-h-screen flex items-center justify-center overflow-hidden px-6">
  <div class="pointer-events-none absolute -top-32 -left-32 w-[500px] h-[500px] bg-blue-600/30 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute bottom-0 -right-32 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-3xl"></div>

  <div class="relative w-full max-w-3xl text-center">
    <img src="assets/images/loho-yeni-1.jpg" alt="HydroPascal Logo" class="h-14 w-auto object-contain rounded-lg ring-1 ring-white/10 mx-auto mb-10">

    <h1 class="text-4xl md:text-5xl font-extrabold leading-tight bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400 bg-clip-text text-transparent">
      Select Your Language / Dil Seçiniz
    </h1>
    <p class="mt-5 text-lg text-slate-300 leading-relaxed max-w-xl mx-auto">
      Please choose a language to continue. / Devam etmek için lütfen bir dil seçin.
    </p>

    <div class="mt-12 grid sm:grid-cols-2 gap-8 max-w-xl mx-auto">
      <a href="en/index.html" class="group bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl hover:-translate-y-2 hover:border-cyan-400/40 hover:shadow-cyan-500/20 transition-all duration-300 flex flex-col items-center">
        <span class="text-4xl mb-4">🇬🇧</span>
        <span class="font-bold text-xl text-white">English</span>
        <span class="mt-3 inline-flex items-center gap-2 text-cyan-300 font-semibold group-hover:text-cyan-200 transition">Continue in English →</span>
      </a>
      <a href="tr/index.html" class="group bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl hover:-translate-y-2 hover:border-cyan-400/40 hover:shadow-cyan-500/20 transition-all duration-300 flex flex-col items-center">
        <span class="text-4xl mb-4">🇹🇷</span>
        <span class="font-bold text-xl text-white">Türkçe</span>
        <span class="mt-3 inline-flex items-center gap-2 text-cyan-300 font-semibold group-hover:text-cyan-200 transition">Türkçe Devam Et →</span>
      </a>
    </div>

    <p class="mt-14 text-xs text-slate-500">© 2026 HydroPascal — All Rights Reserved</p>
  </div>
</div>

</body>
</html>
